[package]
name = "pixelpaw-ai"
version = "0.2.7"
description = "PixelPaw AI - an original intelligent desktop companion"
license = "Apache-2.0"
authors = ["PixelPaw"]
edition = "2021"
rust-version = "1.77"

# The library that main.rs (and, later, mobile targets) call into.
[lib]
name = "pixelpaw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Relaunching the desktop shortcut must surface the running pet, not clone it.
tauri-plugin-single-instance = "2"
# Without this, a release only reaches people who happen to revisit the site.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Global cursor + keyboard-activity polling (cross-platform; Windows uses GetCursorPos/GetAsyncKeyState).
device_query = "2"
# AI provider HTTP lives in Rust so API keys never reach the webview.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Windows-only: low-level mouse hook for global scroll-wheel detection (delta only).
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
  "winuser",
  "windef",
  "minwindef",
  # Reading the foreground window's executable, so the pet can tell a coding
  # agent's window from any other (see dock.rs).
  "processthreadsapi",
  "handleapi",
  "winbase",
  "winnt",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
